name: inception

services:

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
      additional_contexts:
        shell: ./shell
    image: nginx:inception
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html:ro
    networks:
      - inception
    depends_on:
      wordpress:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      CERTS_CRT: ${CERTS_CRT}
      CERTS_KEY: ${CERTS_KEY}
    secrets:
      - source: server_crt
        mode: 0444
      - source: server_key
        mode: 0400

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
      additional_contexts:
        shell: ./shell
    image: wordpress:inception
    container_name: wordpress
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DOMAIN_NAME:    ${DOMAIN_NAME}
      WP_REDIS_HOST:  ${WP_REDIS_HOST}
      WP_REDIS_PORT:  ${WP_REDIS_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER:     ${MYSQL_USER}
      WP_TITLE:       ${WP_TITLE}
      WP_ADMIN_USER:  ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER:        ${WP_USER}
      WP_USER_EMAIL:  ${WP_USER_EMAIL}
    secrets:
      - source: db_password
        mode: 0400
      - source: credentials
        mode: 0400

  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
      additional_contexts:
        shell: ./shell
    image: mariadb:inception
    container_name: mariadb
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER:     ${MYSQL_USER}
    secrets:
      - source: db_password
        mode: 0400
      - source: db_root_password
        mode: 0400

  staticsite:
    build:
      context: ./requirements/bonus/staticsite
      dockerfile: Dockerfile
      additional_contexts:
        shell: ./shell
    image: staticsite:inception
    container_name: staticsite
    ports:
      - "8090:8090"
    networks:
      - inception
    restart: unless-stopped

  redis:
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
      additional_contexts:
        shell: ./shell
    image: redis:inception
    container_name: redis
    networks:
      - inception
    restart: unless-stopped

  ftp:
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
      additional_contexts:
        shell: ./shell
    image: ftp:inception
    container_name: ftp
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
    restart: unless-stopped
    environment:
      FTP_USER:         ${FTP_USER}
      FTP_PASV_ADDRESS: ${FTP_PASV_ADDRESS}
    secrets:
      - source: ftp_password
        mode: 0400

  adminer:
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
      additional_contexts:
        shell: ./shell
    image: adminer:inception
    container_name: adminer
    ports:
      - "8080:8080"
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  dbbackup:
    build:
      context: ./requirements/bonus/dbbackup
      dockerfile: Dockerfile
      additional_contexts:
        shell: ./shell
    image: dbbackup:inception
    container_name: dbbackup
    volumes:
      - backup_data:/backups
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER:     ${MYSQL_USER}
      BACKUP_CRON:    ${BACKUP_CRON}
      BACKUP_KEEP:    ${BACKUP_KEEP}
    secrets:
      - source: db_password
        mode: 0400

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      device: /home/dlesieur/data/mariadb
      o: bind
  wp_data:
    driver: local
    driver_opts:
      type: none
      device: /home/dlesieur/data/wordpress
      o: bind
  backup_data:
    driver: local
    driver_opts:
      type: none
      device: /home/dlesieur/data/backups
      o: bind

networks:
  inception:
    name: inception
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
  server_crt:
    file: ../secrets/server.crt
  server_key:
    file: ../secrets/server.key
  ftp_password:
    file: ../secrets/ftp_password.txt
