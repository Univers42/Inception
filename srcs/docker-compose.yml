services:

  # ── NGINX ─ TLS reverse-proxy (only entrypoint, port 443) ──────────
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx:inception
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html:ro
    networks:
      - inception
    depends_on:
      wordpress:
        condition: service_started
    restart: on-failure
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      CERTS_CRT: ${CERTS_CRT}
      CERTS_KEY: ${CERTS_KEY}
    secrets:
      - ca_key
      - ca_crt

  # ── WordPress + php-fpm ────────────────────────────────────────────
  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress:inception
    container_name: wordpress
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    restart: on-failure
    environment:
      DOMAIN_NAME:  ${DOMAIN_NAME}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER:   ${MYSQL_USER}
      WP_TITLE:     ${WP_TITLE}
      WP_ADMIN_USER:  ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER:      ${WP_USER}
      WP_USER_EMAIL: ${WP_USER_EMAIL}
    secrets:
      - db_password
      - credentials

  # ── MariaDB ────────────────────────────────────────────────────────
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb:inception
    container_name: mariadb
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    restart: on-failure
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER:     ${MYSQL_USER}
    secrets:
      - db_password
      - db_root_password

# ── Named volumes (local driver → host path) ────────────────────────
volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      device: /home/dlesieur/data/mariadb
      o: bind
  wp_data:
    driver: local
    driver_opts:
      type: none
      device: /home/dlesieur/data/wordpress
      o: bind

# ── Docker network ──────────────────────────────────────────────────
networks:
  inception:
    driver: bridge

# ── Docker secrets (file-based) ─────────────────────────────────────
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
  ca_key:
    file: ../secrets/ca.key
  ca_crt:
    file: ../secrets/ca.crt
