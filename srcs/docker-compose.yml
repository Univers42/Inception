name: inception

services:

  # ── NGINX ─ TLS termination, sole entrypoint (port 443) ────────────
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx:inception
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html:ro
    networks:
      - inception
    depends_on:
      wordpress:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      CERTS_CRT: ${CERTS_CRT}
      CERTS_KEY: ${CERTS_KEY}
    secrets:
      - source: server_crt
        mode: 0444
      - source: server_key
        mode: 0400

  # ── WordPress + php-fpm ────────────────────────────────────────────
  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress:inception
    container_name: wordpress
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DOMAIN_NAME:    ${DOMAIN_NAME}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER:     ${MYSQL_USER}
      WP_TITLE:       ${WP_TITLE}
      WP_ADMIN_USER:  ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER:        ${WP_USER}
      WP_USER_EMAIL:  ${WP_USER_EMAIL}
    secrets:
      - source: db_password
        mode: 0400
      - source: credentials
        mode: 0400

  # ── MariaDB ────────────────────────────────────────────────────────
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb:inception
    container_name: mariadb
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER:     ${MYSQL_USER}
    secrets:
      - source: db_password
        mode: 0400
      - source: db_root_password
        mode: 0400

  # ── Bonus: static showcase site (no PHP, plain HTML/CSS/JS) ────────
  staticsite:
    build:
      context: ./requirements/bonus/staticsite
      dockerfile: Dockerfile
    image: staticsite:inception
    container_name: staticsite
    ports:
      - "8090:8090"
    networks:
      - inception
    restart: unless-stopped

# ── Named volumes stored under /home/dlesieur/data (subject rule) ───
volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      device: /home/dlesieur/data/mariadb
      o: bind
  wp_data:
    driver: local
    driver_opts:
      type: none
      device: /home/dlesieur/data/wordpress
      o: bind

# ── Docker network (bridge; host networking is forbidden) ───────────
networks:
  inception:
    name: inception
    driver: bridge

# ── Docker secrets (file-based) ─────────────────────────────────────
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
  server_crt:
    file: ../secrets/server.crt
  server_key:
    file: ../secrets/server.key
