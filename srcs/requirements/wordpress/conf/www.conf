[www]
user                 = nobody
group                = nobody
listen               = 0.0.0.0:9000

; ── Process management ────────────────────────────────────────
pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests      = 500
pm.process_idle_timeout = 10s

; ── Env passthrough (required for Docker secrets/env) ─────────
clear_env            = no
