[www]
user                 = nobody
group                = nobody
listen               = 0.0.0.0:9000

; ── Process management ────────────────────────────────────────
pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests      = 500
pm.process_idle_timeout = 10s

; ── Log worker output to the container's stderr ───────────────
catch_workers_output = yes
decorate_workers_output = no

; ── Pool counters for the lab's traffic view (bonus) ──────────
; The lab API reads "accepted conn" once a second, over FastCGI, to draw the
; nginx → wordpress wire. nginx cannot reach this page: every request it
; forwards carries SCRIPT_NAME of a real .php file (/index.php for WordPress's
; pretty URLs), never /fpm-status.
pm.status_path       = /fpm-status
