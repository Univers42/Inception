[www]
user                 = nobody
group                = nobody
listen               = 0.0.0.0:9000

; ── Process management ────────────────────────────────────────
pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests      = 500
pm.process_idle_timeout = 10s

; ── Log worker output to the container's stderr ───────────────
catch_workers_output = yes
decorate_workers_output = no
