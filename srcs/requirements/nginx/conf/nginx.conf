server {

    # accept HTTPS on IPv4, port 443, TLS termination here
    listen              443 ssl;

    # same, but for IPv6
    listen              [::]:443 ssl;

    # enable HTTP/2 on this connection
    http2               on;

    # which Host header this block answers to
    server_name         ${DOMAIN_NAME};

    # hide nginx version in headers/error pages
    server_tokens       off;



    # only allow these TLS versions (subject requirement)
    ssl_protocols       TLSv1.2 TLSv1.3;

    # path to the public cert nginx presents
    ssl_certificate     ${CERTS_CRT};

    # path to the matching private key
    ssl_certificate_key ${CERTS_KEY};

    # allowed cipher suites for the TLS handshake
    ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305';



    # seconds to hold an idle client connection open
    keepalive_timeout   65;

    # max requests served per kept-alive connection
    keepalive_requests  100;

    # disable Nagle's algorithm, send small packets immediately
    tcp_nodelay         on;



    # filesystem root nginx serves files from
    root                /var/www/html;

    # default file to serve for a directory request
    index               index.php index.html;



    # compress responses
    gzip                on;

    # compression strength (1-9, tradeoff CPU vs size)
    gzip_comp_level     5;

    # which MIME types get compressed
    gzip_types          text/plain text/css application/json application/javascript
                        text/xml application/xml application/xml+rss text/javascript
                        image/svg+xml;

    # don't bother compressing responses smaller than this
    gzip_min_length     256;

    # add "Vary: Accept-Encoding" header for caches/proxies
    gzip_vary           on;

    # also gzip responses to proxied requests
    gzip_proxied        any;


    # max upload size accepted (e.g. WP media uploads)
    client_max_body_size    64M;

    # buffer size before nginx writes body to a temp file
    client_body_buffer_size 128k;


    # cache up to 1000 open file descriptors/metadata
    open_file_cache          max=1000 inactive=20s;

    # revalidate cached entries every 30s
    open_file_cache_valid    30s;

    # only cache a file after 2+ accesses
    open_file_cache_min_uses 2;

    # also cache "file not found" lookups
    open_file_cache_errors   on;



    location / {
        # serve file if it exists, else dir, else hand to WP's router
        try_files $uri $uri/ /index.php$is_args$args;
    }


    # any request ending in .php
    location ~ \.php$ {
        # split "script.php/extra/path" into script + PATH_INFO
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # use Docker's internal DNS, refresh every 10s
        resolver               127.0.0.11 valid=10s ipv6=off;

        # variable forces re-resolution per request (avoids stale IP caching)
        set $upstream_wordpress wordpress:9000;

        # forward the PHP request to php-fpm on wordpress:9000
       fastcgi_pass            $upstream_wordpress;

        # default script name if none given
        fastcgi_index           index.php;

        # standard FastCGI param set (method, headers, etc.)
        include                 fastcgi_params;

        # tells php-fpm which file to execute
        fastcgi_param           SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # pass along the split PATH_INFO
        fastcgi_param           PATH_INFO       $fastcgi_path_info;

        # max seconds to wait for php-fpm's response
        fastcgi_read_timeout    300;

        # number/size of buffers for reading the FastCGI response
        fastcgi_buffers         16 16k;

        # buffer size for the first part of the response (headers)
        fastcgi_buffer_size     32k;

        # keep the connection to php-fpm alive for reuse
        fastcgi_keep_conn       on;
    }

    # any request for a dotfile like .htaccess
    location ~ /\.ht {
        # block it outright
        deny all;
    }

    # static asset extensions
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {

        # tell browsers to cache for 30 days
        expires 30d;

        # reinforce aggressive caching
        add_header Cache-Control "public, immutable";

        # skip logging these (reduces log noise/IO)
        access_log off;
    }
}
