# ── the lab's upstreams (bonus) ─────────────────────────────────────────────
# A pool of kept-alive connections to each, instead of a new TCP connection
# per request. With one connection per request, every closed one sits in
# TIME_WAIT for a minute: measured, 3 300 req/s to /api/v1/ filled the whole
# local port range (28 267 sockets) in 9 s, and nginx answered 502 until they
# expired.
# `resolve` keeps re-resolving the name through Docker's DNS, so a recreated
# container is found again without an nginx restart. That is what the variable
# in the WordPress location does too; an upstream block can do it since nginx
# 1.27.3 (this image runs 1.28.3), and a variable cannot keep connections alive.
upstream lab_web {
    zone              lab_web 64k;
    resolver          127.0.0.11 valid=10s ipv6=off;
    server            web:8080 resolve;
    keepalive         16;
    # below the upstream's own idle timeout, so nginx never picks a connection
    # the other end is closing
    keepalive_timeout 4s;
}

upstream lab_api {
    zone              lab_api 64k;
    resolver          127.0.0.11 valid=10s ipv6=off;
    server            api:3000 resolve;
    keepalive         32;
    # node closes an idle keep-alive socket after 5 s
    keepalive_timeout 4s;
}

server {

    # accept HTTPS on IPv4, port 443, TLS termination here
    listen              443 ssl;

    # same, but for IPv6
    listen              [::]:443 ssl;

    # enable HTTP/2 on this connection
    http2               on;

    # which Host header this block answers to
    server_name         ${DOMAIN_NAME};

    # redirects nginx itself issues (e.g. /lab -> /lab/) stay relative, so they
    # survive a port-remapped or NAT-forwarded host as well as plain :443
    absolute_redirect   off;

    # hide nginx version in headers/error pages
    server_tokens       off;



    # only allow these TLS versions (subject requirement)
    ssl_protocols       TLSv1.2 TLSv1.3;

    # path to the public cert nginx presents
    ssl_certificate     ${CERTS_CRT};

    # path to the matching private key
    ssl_certificate_key ${CERTS_KEY};

    # allowed cipher suites for the TLS handshake
    ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305';



    # seconds to hold an idle client connection open
    keepalive_timeout   65;

    # max requests served per kept-alive connection
    keepalive_requests  100;

    # disable Nagle's algorithm, send small packets immediately
    tcp_nodelay         on;



    # filesystem root nginx serves files from
    root                /var/www/html;

    # default file to serve for a directory request
    index               index.php index.html;



    # compress responses
    gzip                on;

    # compression strength (1-9, tradeoff CPU vs size)
    gzip_comp_level     5;

    # which MIME types get compressed
    gzip_types          text/plain text/css application/json application/javascript
                        text/xml application/xml application/xml+rss text/javascript
                        image/svg+xml;

    # don't bother compressing responses smaller than this
    gzip_min_length     256;

    # add "Vary: Accept-Encoding" header for caches/proxies
    gzip_vary           on;

    # also gzip responses to proxied requests
    gzip_proxied        any;


    # max upload size accepted (e.g. WP media uploads)
    client_max_body_size    64M;

    # buffer size before nginx writes body to a temp file
    client_body_buffer_size 128k;


    # cache up to 1000 open file descriptors/metadata
    open_file_cache          max=1000 inactive=20s;

    # revalidate cached entries every 30s
    open_file_cache_valid    30s;

    # only cache a file after 2+ accesses
    open_file_cache_min_uses 2;

    # also cache "file not found" lookups
    open_file_cache_errors   on;



    location / {
        # serve file if it exists, else dir, else hand to WP's router
        try_files $uri $uri/ /index.php$is_args$args;
    }


    # ── the lab: static Astro site (web) and its JSON API (api) ─────────────
    # `^~` = longest-prefix match wins and the regex locations below are never
    # consulted, so /lab/_astro/*.js is proxied instead of being looked for
    # under /var/www/html. Both upstreams (lab_web, lab_api, top of this file)
    # are plain HTTP on the private network; TLS terminates here, exactly like
    # WordPress.

    # /lab without the slash: the site is built with trailingSlash: 'always'
    location = /lab {
        return 301 /lab/;
    }

    location ^~ /lab/ {
        # the lab_web pool above: kept-alive, and re-resolved when web is recreated
        proxy_pass            http://lab_web;

        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;

        # web answers with relative Location headers; nothing to rewrite
        proxy_redirect        off;
        proxy_read_timeout    30s;
    }

    location = /api/v1 {
        return 301 /api/v1/;
    }

    location ^~ /api/v1/ {
        proxy_pass            http://lab_api;

        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        # the API rate-limits per client address: this header is its source
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;

        # JSON bodies are tiny (the API caps them at 16 KB itself)
        client_max_body_size  64k;
        # /api/v1/traffic is a long-lived event stream: it sends at least one
        # frame a second, so 30 s of silence still means a dead upstream. The
        # API turns response buffering off for it with X-Accel-Buffering: no.
        proxy_read_timeout    30s;
        # while the api container is (re)starting, fail fast rather than hang
        proxy_connect_timeout 3s;
    }

    # any request ending in .php
    location ~ \.php$ {
        # split "script.php/extra/path" into script + PATH_INFO
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # use Docker's internal DNS, refresh every 10s
        resolver               127.0.0.11 valid=10s ipv6=off;

        # variable forces re-resolution per request (avoids stale IP caching)
        set $upstream_wordpress wordpress:9000;

        # forward the PHP request to php-fpm on wordpress:9000
       fastcgi_pass            $upstream_wordpress;

        # default script name if none given
        fastcgi_index           index.php;

        # standard FastCGI param set (method, headers, etc.)
        include                 fastcgi_params;

        # tells php-fpm which file to execute
        fastcgi_param           SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # pass along the split PATH_INFO
        fastcgi_param           PATH_INFO       $fastcgi_path_info;

        # max seconds to wait for php-fpm's response
        fastcgi_read_timeout    300;

        # number/size of buffers for reading the FastCGI response
        fastcgi_buffers         16 16k;

        # buffer size for the first part of the response (headers)
        fastcgi_buffer_size     32k;

        # keep the connection to php-fpm alive for reuse
        fastcgi_keep_conn       on;
    }

    # any request for a dotfile like .htaccess
    location ~ /\.ht {
        # block it outright
        deny all;
    }

    # static asset extensions
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {

        # tell browsers to cache for 30 days
        expires 30d;

        # reinforce aggressive caching
        add_header Cache-Control "public, immutable";

        # skip logging these (reduces log noise/IO)
        access_log off;
    }
}
