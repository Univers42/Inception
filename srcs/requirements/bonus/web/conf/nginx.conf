# srcs/requirements/bonus/web/conf/nginx.conf
#
# The whole nginx configuration of the web container. It replaces the package
# default because the master process runs unprivileged: the pid file and every
# temp path must live where the 'nginx' user can write, and there is no `user`
# directive (it only makes sense for a root master).
#
# This nginx serves bytes off disk and nothing else. It is reachable only from
# the main nginx, which proxies https://<domain>/lab/ here.

pid              /tmp/nginx.pid;
worker_processes 1;
error_log        /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   /dev/stdout;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server_tokens     off;
    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 30;

    # Text assets are compressed on the fly. woff2 and png are already
    # compressed and are left alone.
    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/manifest+json;

    server {
        listen      8080;
        listen      [::]:8080;
        root        /usr/share/nginx/html;
        index       index.html;

        # Redirects are relative: the public hostname and port belong to the
        # edge nginx, not to this one.
        absolute_redirect off;
        port_in_redirect  off;

        include /etc/nginx/headers.conf;

        location = / {
            return 302 /lab/;
        }

        # Hashed build output: the file name changes when the content does,
        # so a year of immutable caching is exact, not optimistic.
        location ^~ /lab/_astro/ {
            include /etc/nginx/headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
            try_files $uri =404;
        }

        # Self-hosted fonts are not hashed; a month is long enough to never
        # re-download during a visit and short enough to pick up a new cut.
        location ^~ /lab/fonts/ {
            include /etc/nginx/headers.conf;
            add_header Cache-Control "public, max-age=2592000" always;
            access_log off;
            try_files $uri =404;
        }

        # HTML is always revalidated (ETag + Last-Modified come from the file),
        # so a rebuilt page is seen on the next load.
        location /lab/ {
            include /etc/nginx/headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ =404;
        }

        error_page 404 /lab/404.html;
    }
}
