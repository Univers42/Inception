# srcs/requirements/bonus/web/conf/headers.conf
#
# Security headers for every response. Included in each location that sets its
# own add_header, because nginx's add_header does not inherit once a block
# declares one of its own.
#
# The CSP has no 'unsafe-inline': every style is an external stylesheet and
# every script an external module (Astro's build is configured never to inline
# either). data: is allowed for images only — the sprite sheet is rasterised in
# memory from source, so nothing else needs it. connect-src 'self' is what lets
# the islands call /api/v1/ on the same origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
