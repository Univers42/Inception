# The landing and Deeper, plain HTTP on 8090. The edge nginx proxies three
# prefixes here: the bare /, the landing's /_dream/ assets and /deeper/;
# everything else on the domain is WordPress. Reached directly on the bonus port, a link to the blog or the
# wiki would find nothing in this container, so any other path is sent to the
# same address over HTTPS, where the edge serves it.
server {
    listen              8090;
    listen              [::]:8090;
    server_tokens       off;

    root                /usr/share/nginx/html;
    index               index.html;

    gzip                on;
    gzip_comp_level     5;
    gzip_types          text/plain text/css application/javascript text/javascript image/svg+xml;
    gzip_min_length     256;
    gzip_vary           on;

    # index.html names the hashed bundles: always revalidate it
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # content-hashed by Vite: a changed file has a new name
    location ^~ /_dream/ {
        # One header: `expires` would add a second Cache-Control beside it.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Deeper (world/): the same two rules under its own prefix, and any other
    # path inside it back to its one page.
    # The link card and the film are named by path in the page's og: tags;
    # a crawler wants an absolute URL, and only the request knows the host.
    location = /deeper/ {
        add_header Cache-Control "no-cache";
        sub_filter 'content="/deeper/_world/' 'content="https://$host/deeper/_world/';
        sub_filter_once off;
        try_files /deeper/index.html =404;
    }

    location ^~ /deeper/_world/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /deeper/ {
        return 302 /deeper/;
    }

    location / {
        return 302 https://$host$request_uri;
    }
}
