server {
    listen              8090;
    listen              [::]:8090;
    server_tokens       off;

    root                /usr/share/nginx/html;
    index               index.html;

    gzip                on;
    gzip_comp_level     5;
    gzip_types          text/plain text/css application/javascript text/javascript image/svg+xml;
    gzip_min_length     256;
    gzip_vary           on;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|svg|png|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
