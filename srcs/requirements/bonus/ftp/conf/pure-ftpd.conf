# Tunables for the FTP bonus. Sourced by tools/entrypoint.sh, which turns them
# into pure-ftpd's command-line flags — pure-ftpd is configured by flags rather
# than by a config file, so this keeps the settings in conf/ where the rest of
# the project keeps them, instead of buried in the entrypoint.

# Passive port range. Must match the ports published in docker-compose.yml, and
# 1:1, or the range the server advertises will not be the range that is
# reachable and every directory listing hangs.
FTP_PASV_MIN=21000
FTP_PASV_MAX=21010

# Simultaneous clients, and per-IP limit.
FTP_MAX_CLIENTS=20
FTP_MAX_PER_IP=5

# Idle timeout, seconds.
FTP_IDLE_TIMEOUT=900
