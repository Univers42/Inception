# Local (system) accounts only. Anonymous FTP into the site volume would be an
# unauthenticated write path straight into the running website.
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# Confine the session to the user's home (/var/www/html). Without this an FTP
# client could walk the whole container filesystem.
chroot_local_user=YES
# vsftpd refuses a writable chroot root by default (a historical security
# check). The site directory has to be writable for FTP to be worth having, so
# the check is explicitly waived — the chroot itself still applies.
allow_writeable_chroot=YES

# Alpine's vsftpd is built without the seccomp filter it expects; leaving this
# on makes the process die on the first data transfer with a bare
# "500 OOPS: priv_sock_get_cmd".
seccomp_sandbox=NO

# Passive mode: the client opens the data connection, which is the only thing
# that works through NAT. The range is small and fixed so it can be forwarded
# explicitly — see PASV_ADDRESS in the entrypoint for the address half.
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010
pasv_addr_resolve=NO

listen=YES
listen_ipv6=NO
port_enable=YES
connect_from_port_20=YES

# Logging goes through syslog, NOT to a file.
#
# The obvious "vsftpd_log_file=/dev/stdout" does not work here: vsftpd reopens
# its log after dropping privileges and chrooting, and by then /dev/stdout —
# a symlink into /proc/self/fd — no longer resolves for that process. vsftpd
# then refuses every connection with
#     500 OOPS: failed to open vsftpd log file:/dev/stdout
# which looks like an auth failure but happens before authentication.
xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=YES
syslog_enable=YES
dual_log_enable=NO

secure_chroot_dir=/var/lib/vsftpd/empty
pam_service_name=vsftpd
