# Cache, not a database — see the Dockerfile.
#
# Persistence is deliberately OFF. Everything in here is derived from MariaDB
# and can be rebuilt at any time, so writing it to disk would cost I/O and add a
# second source of truth for data that already has one.
save ""
appendonly no

# Bound in size and told what to do when full. Without maxmemory-policy Redis
# answers writes with an error once it fills up, and WordPress would surface
# that as a broken page rather than simply missing the cache.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Reachable on the container network only. protected-mode is off because the
# only route to this port is the inception bridge network, which nothing outside
# the compose project can join, and no host port is published.
bind 0.0.0.0
protected-mode no
port 6379

# Logs to stdout so `docker logs redis` works like every other service here.
logfile ""
loglevel notice
