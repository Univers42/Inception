# 42ctl — host-side configuration for this project.
#
# Read by the `make vault-*` targets. This file holds ONLY endpoints, identifiers
# and non-secret preferences: it is tracked by git, and compliance S14/S15/S24 grep
# tracked files *and the whole git history* for credential-shaped strings. Nothing
# secret belongs here. Your identity keypair and session token live in ~/.42ctl on
# the host (mounted into the container at run time), never in this repository.

# ── Where the vault lives ───────────────────────────────────────────────────
# The fly.io deployment of vault42-server. `42ctl config endpoint` is driven from
# this value, so changing the URL here is the only edit needed to repoint the CLI.
C42_ENDPOINT=https://vault42.fly.dev

# The profile 42ctl resolves under (`--profile`, or FT_PROFILE in the environment).
C42_PROFILE=default

# ── Which build of the CLI to run ───────────────────────────────────────────
# Built locally by `make 42ctl` from the pinned source below — never pulled.
C42_IMAGE=42ctl:inception
C42_REPO=https://github.com/Univers42/42ctl.git
C42_REF=main

# ── What the vault owns in this repository ──────────────────────────────────
# `make vault-push` sends exactly these paths; `make vault-pull` restores them to
# the same paths, in this order. Order matters: srcs/.env is written last so that
# a half-finished pull can never leave the stack pointing at secrets that are not
# on disk yet.
C42_PATHS="secrets/db_password.txt secrets/db_root_password.txt secrets/credentials.txt secrets/ftp_password.txt srcs/.env"

# ── Should `make setup` pull from the vault automatically? ──────────────────
# Off by default: a fresh clone must still come up with `make` alone, with locally
# generated random secrets, exactly as the subject expects. Set to 1 once you have
# authenticated (`make vault-login`) and want this machine to track the vault.
C42_AUTOPULL=0
