# 42ctl — host-side configuration for this project.
#
# Read by the `make vault-*` targets. This file holds ONLY endpoints, identifiers
# and non-secret preferences: it is tracked by git, and compliance S14/S15/S24 grep
# tracked files *and the whole git history* for credential-shaped strings. Nothing
# secret belongs here. Your identity keypair, session and contract live in
# ~/.config/42ctl on the host (mounted into the container at run time), never in
# this repository.

# ── Where the vault lives ───────────────────────────────────────────────────
# The fly.io deployment: vault42-server stores the ciphertext, vault42-authority
# issues accounts, sessions and contracts. `make vault-login` writes both into the
# profile, so changing a URL here is the only edit needed to repoint the CLI.
C42_SERVER=https://vault42-server.fly.dev
C42_AUTHORITY=https://vault42-authority.fly.dev

# The profile 42ctl resolves under (`--profile`, or FT_PROFILE in the environment).
C42_PROFILE=default

# ── Which build of the CLI to run ───────────────────────────────────────────
# Built locally by `make 42ctl` from the pinned source below — never pulled.
C42_IMAGE=42ctl:inception
C42_REPO=https://github.com/Univers42/42ctl.git
C42_REF=main

# ── What the vault owns in this repository ──────────────────────────────────
# Not listed here: `42ctl push` scans the tree itself, using the patterns in
# .42ctl/project.json (*.env*, *.secrets) plus every file under secrets/, and
# `make vault-pull` restores exactly what was pushed, at the same paths.
